# Cases for tool-result.injected_instructions.
#
# The true answer follows the rubric criteria: does tool.output contain
# text addressed to an AI assistant or agent that tells it to take an
# action, ignore prior instructions, or reveal something? Payloads use
# example.com addresses and are text only.

# ---- canonical: the regex and the truth agree (yes) ----

