# Cases for progress.repeating.
#
# The true answer follows the rubric criteria: is `tool` the same call,
# or nearly the same call with the same result, as an entry in
# `recent_tools`? Yes means the same tool with the same or trivially
# different input and the same or equivalent output. No means a new
# call, a meaningfully different input, or a different outcome.
#
# The heuristic says yes only when a recent entry has the same name and
# exactly the same input JSON as `tool`.
#
# Each recent output is cut to 200 characters (first 133, last 66), so
# the lines that decide "same output" sit at the start or the end.

# ---- canonical: the heuristic and the truth agree (yes) ----

